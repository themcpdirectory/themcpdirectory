services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mcpdirectory
      POSTGRES_PASSWORD: mcpdirectory
      POSTGRES_USER: mcpdirectory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpdirectory -d mcpdirectory"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
