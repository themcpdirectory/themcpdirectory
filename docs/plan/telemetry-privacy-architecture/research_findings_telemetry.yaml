plan_id: telemetry-privacy-architecture
objective: Inspect existing usage telemetry and map the smallest privacy-preserving architecture for CLI search/add/remove/update events.
focus_area: telemetry
created_at: 2026-09-01T00:00:00Z
created_by: gem-researcher
status: completed

tldr: |
  - No first-party behavioral telemetry pipeline exists in the API, database, worker, domain, CLI, or web discovery surfaces.
  - Existing API logs are operational and minimized; Better Auth includes a transitive telemetry package but its installed implementation defaults to disabled and the application does not enable it.
  - The smallest isolated pipeline is CLI best-effort reporting -> strict POST contract -> dedicated raw table -> daily aggregates -> bounded worker retention.
  - Repository policy currently requires CLI telemetry disabled by default; changing that posture requires product/privacy approval and legal-copy updates before launch.

research_metadata:
  methodology: Hybrid semantic and exact search, targeted file reads, dependency/caller tracing, schema and migration inspection, test-pattern inspection, and installed dependency verification.
  scope: API middleware/routes/logging, DB schemas/migrations, worker scheduling/retention, domain boundaries, CLI runtime/commands/receipts, web search/detail/install-copy, privacy/product/legal documents, and installed telemetry dependencies.
  confidence: high
  coverage: 94
  decision_blockers: 2
  research_blockers: 0

