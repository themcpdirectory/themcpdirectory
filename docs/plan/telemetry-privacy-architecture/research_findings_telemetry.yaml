domain_security_considerations:
  sensitive_areas:
    - {
        area: CLI command context,
        location: packages/cli/src/commands,
        concern: Queries,
        paths,
        arguments,
        config,
        receipt hashes/fingerprints,
        error text,
        tokens,
        keys,
        and project data must never enter the event object.,
      }
    - {
        area: Ingestion abuse,
        location: apps/api/src/http/rate-limit.ts,
        concern: Anonymous writes require a separate low-capacity limiter,
        strict content type/body size,
        one-event requests,
        and bounded dimensions.,
      }
    - {
        area: Aggregate disclosure,
        location: packages/db/src/schema,
        concern: Low-count multidimensional cells can reveal rare client/server combinations and require suppression before exposure.,
      }
  authentication_patterns_in_domain: Proposed ingestion is anonymous; no user, session, installation, device, or generated persistent identifier is present.
  authorization_patterns_in_domain: Write-only ingestion is public and rate-limited; aggregate reads remain internal unless separately authorized and thresholded.
  data_validation_in_domain: Strict discriminated event schema; event in [search, add, remove, update]; bounded enum dimensions; slug only where known; server assigns receivedAt and ignores/rejects client timestamps.

minimal_architecture_mapping:
  collection_default: disabled, preserving current engineering and product authority; enabling requires an explicit approved policy change.
  opt_out_precedence: If DO_NOT_TRACK=1 or MCPDIR_DISABLE_TELEMETRY=1, construct no request and invoke no reporter regardless of future enablement state.
  event_contract:
    {
      schemaVersion: 1,
      event: "search|add|remove|update",
      slug: "optional canonical slug",
      cliVersion: "bounded semver",
      client: "optional supported-client enum",
      success: boolean,
      installVariant: "optional package|remote",
      receivedAt: "server-generated UTC timestamp",
    }
  cardinality_rules: Search omits slug/client/variant; add/remove/update emit one event per attempted client target; slug is canonical; variant is included only when selected or receipt-backed.
  transport: Dedicated POST /api/v1/telemetry/events with application/json, strict small body limit, no retries beyond the command lifetime, short timeout, no output, and fail-open behavior.
  storage: telemetry_events raw append-only table plus telemetry_daily_counts keyed by UTC day/event/slug/CLI major-minor/client/success/variant; neither table stores IP, request ID, user agent, or identifiers.
  aggregation: Idempotent daily upsert from raw rows followed by deletion only after aggregate commit; suppress cells below an approved threshold before any external reporting.
  retention: Raw events 7 days; internal daily aggregates 13 months; worker deletes in bounded batches; operational proxy logs follow their separately approved retention.
  timestamp_policy: receivedAt defaults to database/server time; no client timestamp is accepted, preventing clock-derived fingerprinting and falsified historical writes.

