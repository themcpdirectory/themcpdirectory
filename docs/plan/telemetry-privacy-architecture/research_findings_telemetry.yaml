      question: Will collection remain default-off or receive an approved default-on policy change?,
      context: Governing specs and current legal copy require default-off/no launch analytics,
      while opt-out variables alone imply a possible default-on interpretation.,
      type: decision_blocker,
      affects: [CLI runtime, legal disclosure, release approval],
    }
  - {
      question: What minimum aggregate cell threshold and access audience are approved?,
      context: Server/client/variant/result dimensions can create rare cells even without identifiers.,
      type: decision_blocker,
      affects: [aggregation, reporting],
    }
  - {
      question: Should CLI version retain patch precision in raw rows or be reduced to major.minor at ingestion?,
      context: Patch versions improve regression analysis but increase cardinality; aggregates are mapped to major.minor in the minimal design.,
      type: nice_to_know,
      affects: [event contract, aggregation],
    }

